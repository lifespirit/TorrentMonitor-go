schema_version: 1
id: tapochek.net
name: tapochek.net
kind: forum_topic
mode: http

domains:
  - tapochek.net

defaults:
  access_mode: native
  timezone: Europe/Moscow
  page_timeout_seconds: 30

encoding:
  page: windows-1251
  target: utf-8
  form: windows-1251

urls:
  base: https://tapochek.net
  login: https://tapochek.net/login.php
  auth_check: https://tapochek.net/index.php
  topic: https://tapochek.net/viewtopic.php?t={{ item.torrent_id }}

http:
  proxy: inherit

auth:
  type: form
  check:
    method: GET
    url: https://tapochek.net/index.php
    success:
      contains: login.php?logout=1
  login_form:
    method: POST
    url: https://tapochek.net/login.php
    form_encoding: windows-1251
    headers:
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
      Accept-Language: ru-RU,ru;q=0.9,en;q=0.7
      Origin: https://tapochek.net
      Referer: https://tapochek.net/login.php
    form:
      login_username: "{{ credentials.login }}"
      login_password: "{{ credentials.password }}"
      login: Вход
    success:
      contains: login.php?logout=1

topic:
  ready:
    url:
      exact: https://tapochek.net/viewtopic.php?t={{ item.torrent_id }}
    dom_contains:
      - download.php?id=

  title:
    selector: body
    regex: '(?is)<h1[^>]*class="maintitle"[^>]*>\s*<a[^>]*>(.*?)</a>\s*</h1>'

  updated_at:
    selector: body
    regex: '(?is)Трекер:\s*</td>\s*<td[^>]*>.*?<span[^>]*>([0-9]{2}-[0-9]{2}-[0-9]{4} [0-9]{2}:[0-9]{2})</span>'
    layout: "02-01-2006 15:04"
    timezone: Europe/Moscow

  closed:
    contains_any:
      - Тема закрыта
      - раздача закрыта

download:
  url_from_page:
    selector: body
    regex: "href=[\"']((?:https?://[^\"']+)?/?download\\.php\\?id=[0-9][^\"']*)[\"']"
  before:
    headers:
      Referer: https://tapochek.net/viewtopic.php?t={{ item.torrent_id }}
  validate:
    bencode_torrent: true
    max_size_mb: 5
    reject_if_starts_with:
      - "<!DOCTYPE html"
      - "<html"
